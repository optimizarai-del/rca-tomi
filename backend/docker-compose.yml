services:
  db:
    image: postgres:16-alpine
    container_name: rca_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rca
      POSTGRES_PASSWORD: rca_dev
      POSTGRES_DB: rca
    ports:
      - "5433:5432"   # 5433 host → evita choque con PG local
    volumes:
      - rca_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rca -d rca"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  rca_pgdata:
